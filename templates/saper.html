<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сапёр - Игра на Flask</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* Стили для игры Сапёр */
        .game-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

	.game-container a {
	    color: white;
	}
        
        .game-header {
            background: white;
            color: #000000;
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .game-header h1 {
            margin: 0;
            color: #000000;
            font-size: 36px;
        }
        
        .game-header p {
            margin: 10px 0 0;
            opacity: 0.9;
	    color: #000000;
        }
        
        .game-stats {
            display: flex;
            justify-content: space-around;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            font-size: 18px;
            font-weight: bold;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .stat-value {
            background: white;
            padding: 5px 15px;
            border-radius: 20px;
            color: #333;
        }
        
        .difficulty-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .difficulty-btn {
            padding: 10px 30px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .difficulty-btn:hover {
            background: #f0f0f0;
        }
        
        .difficulty-btn.active {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }
        
        .game-board-container {
            display: flex;
            justify-content: center;
            margin: 30px 0;
        }
        
        .game-board {
            display: inline-grid;
            gap: 3px;
            background-color: rgba();
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .cell {
            width: 40px;
            height: 40px;
            background: #a9a9a9;
            border: 1px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: all 0.1s;
            font-size: 18px;
            border-radius: 4px;
        }
        
        .cell:hover {
            background: #ddd;
            transform: scale(0.95);
        }
        
        .cell.open {
            background: #e0e0e0;
            border: 1px solid #aaa;
            cursor: default;
        }
        
        .cell.open:hover {
            transform: none;
        }
        
        .cell.mine {
            background: #ff4444;
            color: white;
            animation: explode 0.3s ease;
        }
        
        @keyframes explode {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        .cell.flag::before {
            content: "🚩";
        }
        
        .cell.flag {
            background: #ffd700;
        }
        
        .cell[data-number="1"] { color: #0000ff; }
        .cell[data-number="2"] { color: #008000; }
        .cell[data-number="3"] { color: #ff0000; }
        .cell[data-number="4"] { color: #000080; }
        .cell[data-number="5"] { color: #800000; }
        .cell[data-number="6"] { color: #008080; }
        .cell[data-number="7"] { color: #000000; }
        .cell[data-number="8"] { color: #808080; }
        
        .new-game-btn {
            display: block;
            margin: 20px auto;
            padding: 15px 40px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .new-game-btn:hover {
            background: #218838;
        }
        
        .scores-section {
            margin-top: 40px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .scores-section h3 {
            margin-top: 0;
            color: #333;
        }
        
        .scores-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        .scores-table th,
        .scores-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        .scores-table th {
            background: #667eea;
            color: white;
        }
        
        .scores-table tr:hover {
            background: #f5f5f5;
        }
        
        .game-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        
        .game-controls button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #667eea;
            text-decoration: none;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .message-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            text-align: center;
            z-index: 1000;
            display: none;
        }
        
        .message-box.show {
            display: block;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                transform: translate(-50%, -60%);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%);
                opacity: 1;
            }
        }
        
        .message-box button {
            margin-top: 20px;
            padding: 10px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 999;
        }
        
        .overlay.show {
            display: block;
        }
        
        .name-input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        
        .flag-mode {
            background: #ffd700;
            color: #333;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Панель пользователя: заполняет auth.js -->
        <div id="userBar" class="user-bar"></div>

        <div class="game-header">
            <h1>💣 Сапёр 💣</h1>
            <p>Классическая игра на внимание и логику</p>
        </div>
        
        <div class="game-stats">
            <div class="stat-item">
                <span>💣 Мин:</span>
                <span class="stat-value" id="mineCount">3</span>
            </div>
            <div class="stat-item">
                <span>⏱️ Время:</span>
                <span class="stat-value" id="timer">0</span>
            </div>
            <div class="stat-item">
                <span>🔓 Открыто:</span>
                <span class="stat-value" id="openedCount">0</span>
            </div>
            <div class="stat-item">
                <span>🚩 Флагов:</span>
                <span class="stat-value" id="flagCount">0</span>
            </div>
        </div>
        
        <div class="difficulty-selector">
            <button class="difficulty-btn active" onclick="setDifficulty('easy')">🌱 Легкий (5x6, 3 мины)</button>
            <button class="difficulty-btn" onclick="setDifficulty('medium')">🌿 Средний (8x8, 10 мин)</button>
            <button class="difficulty-btn" onclick="setDifficulty('hard')">🌲 Сложный (10x10, 20 мин)</button>
        </div>
        
        <div class="game-board-container">
            <div id="gameBoard" class="game-board"></div>
        </div>
        
        <div class="game-controls">
            <button class="new-game-btn" onclick="newGame()">🔄 Новая игра</button>
        </div>
        
        <div class="scores-section">
            <h3>🏆 Таблица рекордов</h3>
            <div id="scoresContent">
                <table class="scores-table">
                    <thead>
                        <tr>
                            <th>Имя</th>
                            <th>Время (сек)</th>
                            <th>Дата</th>
                        </tr>
                    </thead>
                    <tbody id="scoresBody">
                        <tr><td colspan="3">Загрузка...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <a href="/" class="back-link">← Вернуться на главную</a>
    </div>
    
    <!-- Модальное окно победы -->
    <div class="overlay" id="overlay"></div>
    <div class="message-box" id="nameModal">
        <h3>🎉 Победа!</h3>
        <p>Ваше время: <span id="winTime">0</span> секунд</p>
        <!-- Текст «Рекорд будет сохранён как …» подставляет saper.js -->
        <p id="saveAsText"></p>
        <button onclick="submitScore()">Сохранить рекорд</button>
    </div>

    <!-- auth.js подключается первым: saper.js использует currentUser и escapeHtml из него -->
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/saper.js"></script>
</body>
</html>
