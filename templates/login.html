<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход и регистрация</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .auth-box {
            max-width: 420px;
            margin: 40px auto;
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            font-size: 16px;
            cursor: pointer;
            color: #666;
        }

        .auth-tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            font-weight: bold;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .auth-form .btn {
            width: 100%;
            padding: 12px;
        }

        .hint {
            font-size: 13px;
            color: #999;
            margin-top: 5px;
            margin-bottom: 0;
        }

        #authMessage {
            display: none;
            margin-top: 15px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="auth-box">
        <h2 style="text-align: center;">🔐 Учётная запись</h2>

        <div class="auth-tabs">
            <button class="auth-tab active" id="tabLogin" onclick="showTab('login')">Вход</button>
            <button class="auth-tab" id="tabRegister" onclick="showTab('register')">Регистрация</button>
        </div>

        <!-- Форма входа -->
        <form class="auth-form active" id="loginForm">
            <div class="form-group">
                <label for="loginUsername">Логин</label>
                <input class="form-control" type="text" id="loginUsername" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Пароль</label>
                <input class="form-control" type="password" id="loginPassword" autocomplete="current-password" required>
            </div>
            <button class="btn" type="submit">Войти</button>
        </form>

        <!-- Форма регистрации -->
        <form class="auth-form" id="registerForm">
            <div class="form-group">
                <label for="regUsername">Логин</label>
                <input class="form-control" type="text" id="regUsername" maxlength="20" autocomplete="username" required>
                <p class="hint">От 3 до 20 символов: буквы, цифры и _</p>
            </div>
            <div class="form-group">
                <label for="regPassword">Пароль</label>
                <input class="form-control" type="password" id="regPassword" autocomplete="new-password" required>
                <p class="hint">Не короче 6 символов</p>
            </div>
            <div class="form-group">
                <label for="regPassword2">Повторите пароль</label>
                <input class="form-control" type="password" id="regPassword2" autocomplete="new-password" required>
            </div>
            <button class="btn btn-success" type="submit">Зарегистрироваться</button>
        </form>

        <div id="authMessage" class="alert"></div>

        <a href="/" class="back">← На главную</a>
    </div>

    <script>
        // Куда вернуться после входа: /login?next=/saper → на /saper
        const params = new URLSearchParams(location.search);
        let next = params.get('next') || '/';
        if (!next.startsWith('/') || next.startsWith('//')) next = '/';   // только адреса нашего сайта

        // Переключение вкладок «Вход» / «Регистрация»
        function showTab(tab) {
            document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
            document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
            document.getElementById('loginForm').classList.toggle('active', tab === 'login');
            document.getElementById('registerForm').classList.toggle('active', tab === 'register');
            document.getElementById('authMessage').style.display = 'none';
        }

        function showAuthMessage(text, type) {
            const box = document.getElementById('authMessage');
            box.className = 'alert alert-' + type;
            box.textContent = text;
            box.style.display = 'block';
        }

        // Общая функция: отправить логин и пароль на нужный адрес API
        async function sendAuth(url, username, password) {
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });
                const result = await response.json();

                if (response.ok) {
                    showAuthMessage('✅ Добро пожаловать, ' + result.username + '!', 'success');
                    setTimeout(() => location.href = next, 700);
                } else {
                    showAuthMessage('❌ ' + result.error, 'error');
                }
            } catch (error) {
                showAuthMessage('❌ Ошибка соединения с сервером', 'error');
            }
        }

        // Вход
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();     // не перезагружать страницу, отправим сами через fetch
            sendAuth('/api/login',
                     document.getElementById('loginUsername').value.trim(),
                     document.getElementById('loginPassword').value);
        });

        // Регистрация
        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const password2 = document.getElementById('regPassword2').value;

            // Проверки на клиенте (сервер всё равно проверит ещё раз)
            if (!/^[A-Za-zА-Яа-яЁё0-9_]{3,20}$/.test(username)) {
                showAuthMessage('❌ Логин: от 3 до 20 символов, только буквы, цифры и _', 'error');
                return;
            }
            if (password.length < 6) {
                showAuthMessage('❌ Пароль должен быть не короче 6 символов', 'error');
                return;
            }
            if (password !== password2) {
                showAuthMessage('❌ Пароли не совпадают', 'error');
                return;
            }

            sendAuth('/api/register', username, password);
        });
    </script>
</body>
</html>
